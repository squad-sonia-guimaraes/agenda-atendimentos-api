name: CI - Build .NET

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Restaurar e compilar
    runs-on: ubuntu-latest

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restaurar dependencias
        run: dotnet restore AgendaAtendimentos.slnx

      - name: Compilar solucao
        run: dotnet build AgendaAtendimentos.slnx --configuration Release --no-restore
